<!doctype html>
<html lang="tr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buskit Tools İndir</title>

    <!-- Firebase SDK (برای ثبت آمار دانلود اپ از این صفحه) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDO6bqHivptMf3SuwX3cBj3i_bD_jc1z7M",
        authDomain: "buskitlivefxsite.firebaseapp.com",
        projectId: "buskitlivefxsite",
        storageBucket: "buskitlivefxsite.firebasestorage.app",
        messagingSenderId: "403517891310",
        appId: "1:403517891310:web:c177190040e590c4cd09ff",
        measurementId: "G-1WCJB15HP0",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();

      // ====== ثبت آمار دانلود اپ از طریق همین صفحه‌ی دانلود ======
      // منبع "page" هست تا در پنل ادمین از دانلودهای انجام‌شده از داخل
      // خود سایت (source: "site") جدا دیده بشه؛ تاریخ آخرین دانلود هم
      // همراهش ذخیره می‌شه.
      function trackAppDownloadFromPage(appKey) {
        if (typeof db === "undefined" || !db) return;
        db.collection("downloads")
          .doc(appKey)
          .set(
            {
              count: firebase.firestore.FieldValue.increment(1),
              pageCount: firebase.firestore.FieldValue.increment(1),
              pageLastDownloadAt: firebase.firestore.FieldValue.serverTimestamp(),
            },
            { merge: true },
          )
          .catch((err) =>
            console.error("خطا در ثبت آمار دانلود از صفحه‌ی دانلود:", err),
          );
      }
    </script>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: local("Vazirmatn"), local("Tahoma");
      }

      :root {
        --ink: #16233a;
        --deep: #0f4b8b;
        --sky: #a4c5e6;
        --border: #1b5fa8;
        --paper: #f4f7fb;
        --go: #2e7d32;
        --go-dark: #245f27;
        --brochure: #0f4b8b;
        --brochure-dark: #0c3a6c;
        --poster: #8a3ab0;
        --poster-dark: #6e2c8d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 18px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 2px solid var(--sky);
        border-radius: 18px;
        padding: 30px 30px 34px;
        text-align: center;
      }

      /* Responsive: small phones */
      @media (max-width: 420px) {
        body {
          padding: 20px 12px;
        }

        .card {
          max-width: 100%;
          padding: 24px 18px 26px;
          border-radius: 14px;
        }

        .logo {
          margin-bottom: 16px;
        }

        h1 {
          font-size: 18px;
        }

        p.sub {
          font-size: 13.5px;
          margin-bottom: 20px;
        }

        .lang-btn {
          font-size: 12px;
          padding: 5px 10px;
        }

        a.dl {
          font-size: 14.5px;
          padding: 13px 16px;
        }

        .hint {
          font-size: 11.5px;
        }
      }

      @media (max-width: 340px) {
        .lang-switch {
          gap: 5px;
        }

        .lang-btn {
          font-size: 11px;
          padding: 4px 8px;
        }
      }

      /* Language switcher */
      .lang-switch {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-bottom: 22px;
        flex-wrap: wrap;
      }

      .lang-btn {
        border: 2px solid var(--sky);
        background: #ffffff;
        color: var(--deep);
        font-size: 13px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }

      .lang-btn.active {
        background: var(--deep);
        color: #ffffff;
        border-color: var(--deep);
      }

      .logo {
        width: 100%;
        height: auto;
        margin: 0 auto 22px;
        display: block;
        border-radius: 10px;
      }

      h1 {
        font-size: 21px;
        font-weight: 700;
        margin: 0 0 8px;
        color: var(--deep);
      }

      p.sub {
        font-size: 14.5px;
        line-height: 1.9;
        color: #55647d;
        margin: 0 0 26px;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      a.dl {
        display: block;
        text-decoration: none;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        padding: 15px 20px;
        border-radius: 12px;
        border: 2px solid #ffffff;
        transition: background 0.15s ease;
      }

      a.dl.app {
        background: var(--go);
        box-shadow: 0 0 0 2px var(--go);
      }
      a.dl.app:active {
        background: var(--go-dark);
      }

      a.dl.brochure {
        background: var(--brochure);
        box-shadow: 0 0 0 2px var(--brochure);
      }
      a.dl.brochure:active {
        background: var(--brochure-dark);
      }

      a.dl.poster {
        background: var(--poster);
        box-shadow: 0 0 0 2px var(--poster);
      }
      a.dl.poster:active {
        background: var(--poster-dark);
      }

      a.dl.site {
        background: #ffffff;
        color: var(--deep);
        border: 2px solid var(--deep);
        box-shadow: none;
      }
      a.dl.site:active {
        background: #eef3fa;
      }

      .hint {
        margin-top: 22px;
        font-size: 12.5px;
        color: #8492a8;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="lang-switch" id="langSwitch">
        <button class="lang-btn" data-lang="fa">فارسی</button>
        <button class="lang-btn" data-lang="tr">Türkçe</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="de">Deutsch</button>
      </div>

      <img class="logo" src="./buskit-logo.png" alt="Buskit Tools" />

      <p class="sub" id="subtitle">
        Uygulamanın en son sürümünü doğrudan Android telefonunuza kurun.
      </p>

      <div class="buttons">
        <a
          class="dl app"
          id="appBtn"
          href="./downloads/BuskitTools_v1.apk"
          download
          onclick="trackAppDownloadFromPage('buskit-tools')"
        >
          <span id="appBtnText">Kurulum Dosyasını İndir (APK)</span>
        </a>
        <a
          class="dl brochure"
          id="brochureBtn"
          href="./downloads/BrochureTR.pdf"
          download
        >
          <span id="brochureBtnText">Broşürü İndir (PDF)</span>
        </a>
        <a
          class="dl poster"
          id="posterBtn"
          href="./downloads/PosterTR.png"
          download
        >
          <span id="posterBtnText">Posteri İndir (PNG)</span>
        </a>
        <a
          class="dl site"
          id="siteBtn"
          href="https://www.BuskitApps.com"
          target="_blank"
          rel="noopener"
        >
          <span id="siteBtnText">Ana Siteye Git</span>
        </a>
      </div>

      <p class="hint" id="hint">
        Telefonunuz "bilinmeyen kaynak" uyarısı verirse, ayarlardan kurulum
        iznini verin — bu normaldir, çünkü uygulama Google Play'den değildir.
      </p>
    </div>

    <script>
      const translations = {
        fa: {
          dir: "rtl",
          htmlLang: "fa",
          pageTitle: "دانلود Buskit Tools",
          title: "Buskit Tools",
          subtitle:
            "آخرین نسخه اپلیکیشن را مستقیماً روی گوشی اندروید خود نصب کنید.",
          appBtn: "دانلود فایل نصب (APK)",
          brochureBtn: "دانلود بروشور (PDF)",
          posterBtn: "دانلود پوستر (PNG)",
          hint: 'اگر گوشی شما هشدار "منبع ناشناس" داد، از تنظیمات اجازه نصب را بدهید — این عادی است، چون اپلیکیشن از Google Play نیست.',
          brochureFile: "BrochureFA.pdf",
          posterFile: "PosterFA.png",
          siteBtn: "برو به سایت اصلی",
        },
        tr: {
          dir: "ltr",
          htmlLang: "tr",
          pageTitle: "Buskit Tools İndir",
          title: "Buskit Tools",
          subtitle:
            "Uygulamanın en son sürümünü doğrudan Android telefonunuza kurun.",
          appBtn: "Kurulum Dosyasını İndir (APK)",
          brochureBtn: "Broşürü İndir (PDF)",
          posterBtn: "Posteri İndir (PNG)",
          hint: 'Telefonunuz "bilinmeyen kaynak" uyarısı verirse, ayarlardan kurulum iznini verin — bu normaldir, çünkü uygulama Google Play\'den değildir.',
          brochureFile: "BrochureTR.pdf",
          posterFile: "PosterTR.png",
          siteBtn: "Ana Siteye Git",
        },
        en: {
          dir: "ltr",
          htmlLang: "en",
          pageTitle: "Download Buskit Tools",
          title: "Buskit Tools",
          subtitle:
            "Install the latest version of the app directly on your Android phone.",
          appBtn: "Download Installer (APK)",
          brochureBtn: "Download Brochure (PDF)",
          posterBtn: "Download Poster (PNG)",
          hint: 'If your phone shows an "unknown source" warning, allow the installation permission in settings — this is normal, since the app is not from Google Play.',
          brochureFile: "BrochureEN.pdf",
          posterFile: "PosterEN.png",
          siteBtn: "Go to Main Site",
        },
        de: {
          dir: "ltr",
          htmlLang: "de",
          pageTitle: "Buskit Tools herunterladen",
          title: "Buskit Tools",
          subtitle:
            "Installieren Sie die neueste Version der App direkt auf Ihrem Android-Telefon.",
          appBtn: "Installationsdatei herunterladen (APK)",
          brochureBtn: "Broschüre herunterladen (PDF)",
          posterBtn: "Poster herunterladen (PNG)",
          hint: 'Wenn Ihr Telefon eine Warnung "unbekannte Quelle" anzeigt, erlauben Sie die Installation in den Einstellungen — das ist normal, da die App nicht von Google Play stammt.',
          brochureFile: "BrochureDE.pdf",
          posterFile: "PosterDE.png",
          siteBtn: "Zur Hauptseite",
        },
      };

      function applyLanguage(lang) {
        const t = translations[lang];
        if (!t) return;

        document.documentElement.lang = t.htmlLang;
        document.documentElement.dir = t.dir;
        document.title = t.pageTitle;

        document.getElementById("subtitle").textContent = t.subtitle;
        document.getElementById("appBtnText").textContent = t.appBtn;
        document.getElementById("brochureBtnText").textContent = t.brochureBtn;
        document.getElementById("posterBtnText").textContent = t.posterBtn;
        document.getElementById("siteBtnText").textContent = t.siteBtn;
        document.getElementById("hint").textContent = t.hint;

        document
          .getElementById("brochureBtn")
          .setAttribute("href", "./downloads/" + t.brochureFile);
        document
          .getElementById("posterBtn")
          .setAttribute("href", "./downloads/" + t.posterFile);

        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });

        localStorage && localStorage.setItem
          ? (() => {
              try {
                localStorage.setItem("buskitLang", lang);
              } catch (e) {}
            })()
          : null;
      }

      document.getElementById("langSwitch").addEventListener("click", (e) => {
        const btn = e.target.closest(".lang-btn");
        if (!btn) return;
        applyLanguage(btn.dataset.lang);
      });

      // Default language: Turkish (matches original page)
      let initialLang = "tr";
      try {
        const saved = localStorage.getItem("buskitLang");
        if (saved && translations[saved]) initialLang = saved;
      } catch (e) {}

      applyLanguage(initialLang);
    </script>
  </body>
</html>
